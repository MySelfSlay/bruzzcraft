<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/fav.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BruzzCraft - A Minecraft server made by the Bruzz for the Bruzz" />
    <meta name="theme-color" content="#000000" />
    <title>BruzzCraft</title>
    
    <!-- Preload critical assets -->
    <link rel="preload" href="/src/index.css" as="style">
    <link rel="preload" href="/src/main.tsx" as="script" type="module">
    <link rel="preload" href="/images/logo_big.png" as="image" fetchpriority="high">
    <link rel="preload" href="/images/background.png" as="image" fetchpriority="high">
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://api.mcsrvstat.us" crossorigin>
    <link rel="dns-prefetch" href="https://api.mcsrvstat.us">
    
    <!-- Font optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Meta tags for social sharing -->
    <meta property="og:title" content="BruzzCraft">
    <meta property="og:description" content="Dive into BruzzCraft: Endless Thrills, Epic Modes, Cross-Platform Fun for All!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bruzzcraft.xyz">
    <meta property="og:image" content="/images/logo_big.png">
    
    <!-- PWA support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="/images/fav.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div style="text-align: center; padding: 20px;">
        Please enable JavaScript to run this application.
      </div>
    </noscript>
  </body>
</html>
